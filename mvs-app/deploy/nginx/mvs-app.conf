# =====================================================================
#  Nginx: сайт «МВС СТ · Ход работ» на сервере Linux.
#
#  Что делает:
#    • отдаёт собранный интерфейс (папка client/dist) — быстро, без участия Node.js;
#    • запросы /api/… передаёт серверу Node.js на 127.0.0.1:3000;
#    • любые другие адреса (/mkd, /streets/55) отдаёт index.html — страницы разбирает React.
#
#  Как подключить (подробно — docs/03-deployment.md, пункт 2.9):
#    sudo cp /var/www/mvs/mvs-app/deploy/nginx/mvs-app.conf /etc/nginx/sites-available/mvs-app
#    sudo nano /etc/nginx/sites-available/mvs-app      ← поменять server_name на свой домен или IP
#    sudo ln -s /etc/nginx/sites-available/mvs-app /etc/nginx/sites-enabled/
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
#
#  HTTPS сюда допишет certbot (пункт 2.10) — сам, править вручную не нужно.
#  Пути ниже рассчитаны на то, что репозиторий склонирован в /var/www/mvs.
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dash.example.ru;                       # ← ваш домен или IP сервера

    root /var/www/mvs/mvs-app/client/dist;             # собранный интерфейс (npm run build)
    index index.html;

    client_max_body_size 25m;                          # запас для будущей загрузки Excel-отчётов
    server_tokens off;                                 # не показывать версию Nginx

    # ---------- API: передаём серверу Node.js ----------
    # Защитные заголовки для ответов API ставит сам Node.js (helmet), здесь их не добавляем.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;    # по нему Node.js понимает, что вход был по HTTPS
        proxy_read_timeout 60s;
    }

    # ---------- Файлы сборки: в имени хеш, поэтому кэшируем надолго ----------
    location /assets/ {
        include /var/www/mvs/mvs-app/deploy/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---------- Всё остальное — страницы приложения ----------
    location / {
        include /var/www/mvs/mvs-app/deploy/nginx/security-headers.conf;
        # index.html не кэшируем: после обновления браузер сразу получит новую версию
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
