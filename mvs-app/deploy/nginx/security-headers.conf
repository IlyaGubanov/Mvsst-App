# =====================================================================
#  Защитные заголовки для страниц, которые отдаёт сам Nginx (интерфейс из client/dist).
#  Подключается командой include в mvs-app.conf. Ответы /api/… получают такие же заголовки
#  от Node.js (helmet в server/src/app.js) — при изменении правил меняйте их в обоих местах.
#
#  Content-Security-Policy — откуда браузеру можно грузить скрипты, стили и картинки:
#    скрипты — только с этого сайта; картинки — ещё и подложка карты с tile.openstreetmap.org.
#  upgrade-insecure-requests и Strict-Transport-Security — «только HTTPS».
#    ⚠ Если сайт работает БЕЗ HTTPS (внутренняя сеть без сертификата), удалите из CSP
#    «; upgrade-insecure-requests» и строку Strict-Transport-Security — иначе браузер будет
#    запрашивать https:// и интерфейс не загрузится.
# =====================================================================

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; font-src 'self' https: data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data: blob: https://tile.openstreetmap.org; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https: 'unsafe-inline'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
